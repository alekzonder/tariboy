<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><style>*{box-sizing:border-box}body{margin:0;--background:oklch(96.4% .005 255);--muted:oklch(94.4% .007 255);--accent:oklch(93.4% .009 255);--border:oklch(90.4% .009 255)}button:not([class]),input:not([class]){font:inherit;color:inherit}</style></helmet>
<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:11px 16px 9px;font-family:'Geist Variable',ui-sans-serif,system-ui,sans-serif;font-size:13px;color:var(--foreground)">
<label style="display:flex;align-items:center;gap:7px;height:28px;padding:0 9px;border-radius:8px;background:var(--muted);color:var(--muted-foreground);width:220px;flex:0 0 auto"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" style="flex:0 0 auto"><circle cx="5" cy="5" r="3.4"></circle><line x1="7.6" y1="7.6" x2="10.5" y2="10.5"></line></svg><input value="{{ q }}" onChange="{{ setQ }}" placeholder="{{ placeholder }}" style="flex:1 1 auto;min-width:0;border:0;outline:none;background:transparent;color:var(--foreground);font-family:inherit;font-size:12px"></label>
<div style="display:flex;gap:2px;padding:2px;background:var(--muted);border-radius:9px;flex:0 0 auto">
<sc-if value="{{ onActive }}" hint-placeholder-val="{{ true }}"><button onClick="{{ pickActive }}" style="height:24px;padding:0 10px;border:0;border-radius:7px;background:var(--card);box-shadow:0 1px 2px oklch(24% .03 75/.10);font-family:inherit;font-size:12px;font-weight:500;color:var(--foreground);cursor:pointer">Active</button></sc-if>
<sc-if value="{{ offActive }}" hint-placeholder-val="{{ false }}"><button onClick="{{ pickActive }}" style="height:24px;padding:0 10px;border:0;border-radius:7px;background:transparent;font-family:inherit;font-size:12px;color:var(--muted-foreground);cursor:pointer">Active</button></sc-if>
<sc-if value="{{ onClosed }}" hint-placeholder-val="{{ false }}"><button onClick="{{ pickClosed }}" style="height:24px;padding:0 10px;border:0;border-radius:7px;background:var(--card);box-shadow:0 1px 2px oklch(24% .03 75/.10);font-family:inherit;font-size:12px;font-weight:500;color:var(--foreground);cursor:pointer">Closed</button></sc-if>
<sc-if value="{{ offClosed }}" hint-placeholder-val="{{ true }}"><button onClick="{{ pickClosed }}" style="height:24px;padding:0 10px;border:0;border-radius:7px;background:transparent;font-family:inherit;font-size:12px;color:var(--muted-foreground);cursor:pointer">Closed</button></sc-if>
<sc-if value="{{ onAll }}" hint-placeholder-val="{{ false }}"><button onClick="{{ pickAll }}" style="height:24px;padding:0 10px;border:0;border-radius:7px;background:var(--card);box-shadow:0 1px 2px oklch(24% .03 75/.10);font-family:inherit;font-size:12px;font-weight:500;color:var(--foreground);cursor:pointer">All</button></sc-if>
<sc-if value="{{ offAll }}" hint-placeholder-val="{{ true }}"><button onClick="{{ pickAll }}" style="height:24px;padding:0 10px;border:0;border-radius:7px;background:transparent;font-family:inherit;font-size:12px;color:var(--muted-foreground);cursor:pointer">All</button></sc-if>
</div>
<sc-if value="{{ isAll }}" hint-placeholder-val="{{ false }}"><button style="height:28px;padding:0 10px;display:flex;align-items:center;gap:6px;border:0;border-radius:8px;background:var(--muted);font-family:inherit;font-size:12px;cursor:pointer;flex:0 0 auto" style-hover="background:var(--accent)">{{ serverLabel }}<svg width="9" height="9" viewBox="0 0 10 10" style="opacity:.5"><polyline points="2,4 5,7 8,4" fill="none" stroke="currentColor" stroke-width="1.3"></polyline></svg></button></sc-if>
<sc-if value="{{ agentChip }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;height:28px;padding:0 6px 0 10px;border-radius:8px;background:color-mix(in oklab,var(--primary) 12%,transparent);color:var(--primary);font-size:12px;font-weight:500;flex:0 0 auto">{{ agentName }}<button onClick="{{ clearAgent }}" aria-label="Clear agent filter" style="margin-left:4px;width:18px;height:18px;display:grid;place-items:center;border:0;border-radius:5px;background:transparent;color:inherit;cursor:pointer;font-family:inherit">×</button></span></sc-if>
<div style="margin-left:auto;display:flex;align-items:center;gap:6px">
<sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:6px"><span style="font-size:12px;color:var(--muted-foreground)">{{ selCount }} selected</span><x-import component-from-global-scope="TariboyUI.Button" size="xs" variant="secondary" hint-size="54px,24px">Retry</x-import><x-import component-from-global-scope="TariboyUI.Button" size="xs" variant="secondary" hint-size="52px,24px">Pause</x-import><x-import component-from-global-scope="TariboyUI.Button" size="xs" variant="destructive" hint-size="44px,24px">Kill</x-import><span style="width:1px;height:18px;background:var(--border)"></span></span></sc-if>
<x-import component-from-global-scope="TariboyUI.Button" size="xs" onClick="{{ add }}" hint-size="88px,24px">+ New task</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:56},&quot;scope&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;agent&quot;,&quot;all&quot;],&quot;default&quot;:&quot;agent&quot;,&quot;tsType&quot;:&quot;'agent' | 'all'&quot;,&quot;section&quot;:&quot;Config&quot;},&quot;filter&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;active&quot;,&quot;closed&quot;,&quot;all&quot;],&quot;default&quot;:&quot;active&quot;,&quot;tsType&quot;:&quot;'active' | 'closed' | 'all'&quot;},&quot;q&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;server&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;all&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Config&quot;},&quot;agentName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Config&quot;},&quot;selCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Config&quot;},&quot;onQuery&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e: any) =&gt; void&quot;},&quot;onFilter&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v: string) =&gt; void&quot;},&quot;onClearAgent&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onAdd&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const f = p.filter || 'active';
    const isAll = (p.scope || 'agent') === 'all';
    const setF = (v) => () => p.onFilter && p.onFilter(v);
    return {
      q: p.q || '', setQ: p.onQuery || (() => {}),
      placeholder: isAll ? 'Search all tasks' : 'Search tasks',
      onActive: f === 'active', offActive: f !== 'active',
      onClosed: f === 'closed', offClosed: f !== 'closed',
      onAll: f === 'all', offAll: f !== 'all',
      pickActive: setF('active'), pickClosed: setF('closed'), pickAll: setF('all'),
      isAll,
      serverLabel: 'Server: ' + (p.server || 'all'),
      agentChip: isAll && !!p.agentName, agentName: p.agentName,
      clearAgent: () => p.onClearAgent && p.onClearAgent(),
      hasSel: isAll && (p.selCount || 0) > 0, selCount: p.selCount,
      add: () => p.onAdd && p.onAdd()
    };
  }
}
</script>
</body>
</html>
