<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><style>*{box-sizing:border-box}body{margin:0}a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}</style></helmet>
<sc-if value="{{ isProgress }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:6px;background:color-mix(in oklab,var(--status-running) 13%,transparent);color:var(--status-running);font-family:'Geist Variable',ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:500;white-space:nowrap">In progress</span></sc-if>
<sc-if value="{{ isWait }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:6px;background:color-mix(in oklab,var(--primary) 12%,transparent);color:var(--primary);font-family:'Geist Variable',ui-sans-serif,system-ui,sans-serif;font-size:11.5px;font-weight:500;white-space:nowrap">Wait customer</span></sc-if>
<sc-if value="{{ isCancelled }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:6px;height:20px;color:var(--muted-foreground);opacity:.7;font-family:'Geist Variable',ui-sans-serif,system-ui,sans-serif;font-size:11.5px;white-space:nowrap">Cancelled</span></sc-if>
<sc-if value="{{ isQuiet }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:6px;height:20px;color:var(--muted-foreground);font-family:'Geist Variable',ui-sans-serif,system-ui,sans-serif;font-size:11.5px;white-space:nowrap">{{ label }}</span></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:36},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;open&quot;,&quot;in_progress&quot;,&quot;wait_customer&quot;,&quot;done&quot;,&quot;cancelled&quot;],&quot;default&quot;:&quot;in_progress&quot;,&quot;tsType&quot;:&quot;'open' | 'in_progress' | 'wait_customer' | 'done' | 'cancelled'&quot;}}">
const LABEL = { open: 'Open', in_progress: 'In progress', wait_customer: 'Wait customer', done: 'Done', cancelled: 'Cancelled' };
class Component extends DCLogic {
  renderVals() {
    const s = this.props.status || 'open';
    return {
      isProgress: s === 'in_progress',
      isWait: s === 'wait_customer',
      isCancelled: s === 'cancelled',
      isQuiet: s !== 'in_progress' && s !== 'wait_customer' && s !== 'cancelled',
      label: LABEL[s] || 'Open'
    };
  }
}
</script>
</body>
</html>
