schema_version: 2
plugins:
  - name: whoami
  - name: loop
  - name: messages
  - name: context
  - name: status
  - name: workdir
  - name: scripts
  - name: current-task
  - name: tasks
skills:
  - dir: $CURRENT_VERSION_STORE/skills/messages
  - dir: $CURRENT_VERSION_STORE/skills/scripts
  - dir: $CURRENT_VERSION_STORE/skills/tasks
prompts:
  - file: $CURRENT_VERSION_STORE/skills/whoami/prompt.md
  - runtime: identity
  - file: $CURRENT_VERSION_STORE/skills/messages/prompt.md
  - runtime: messages
  - runtime: awaiting-replies
  - file: $CURRENT_VERSION_STORE/skills/context/prompt.md
  - runtime: context
  - file: $CURRENT_VERSION_STORE/skills/status/prompt.md
  - file: $CURRENT_VERSION_STORE/skills/workdir/prompt.md
  - runtime: workdir
  - file: $CURRENT_VERSION_STORE/skills/scripts/prompt.md
  - file: $CURRENT_VERSION_STORE/skills/current-task/prompt.md
  - file: $CURRENT_VERSION_STORE/skills/tasks/prompt.md
  - runtime: user-prompt
  - runtime: one-shot
  - file: $CURRENT_VERSION_STORE/skills/loop/finish.md
