name: Desktop release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Build macOS release
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target
          # Restore the cache desktop-cache.yml saves on main; a cache saved
          # under this tag would be invisible to every later tag.
          shared-key: desktop-release
          save-if: false

      - name: Verify tag version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          canonical_version="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)"
          release_version="$(cat scripts/release-version.txt)"
          test "$tag_version" = "$canonical_version" || {
            echo "tag version $tag_version does not match canonical version $canonical_version" >&2
            exit 1
          }
          test "$tag_version" = "$release_version" || {
            echo "tag version $tag_version does not match declared release version $release_version" >&2
            exit 1
          }

      - name: Install release verification tools
        run: brew install tmux ripgrep

      - name: Build and verify signed release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is required" >&2
            exit 1
          }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || {
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required" >&2
            exit 1
          }
          make desktop-mac

          version="${GITHUB_REF_NAME#v}"
          release_dir="dist/releases/$version"
          shopt -s nullglob
          archives=(desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz)
          signatures=(desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig)
          test "${#archives[@]}" -eq 1 && test "${#signatures[@]}" -eq 1 || {
            echo "expected exactly one macOS updater archive/signature pair" >&2
            exit 1
          }
          archive="${archives[0]}"
          signature="${signatures[0]}"
          test "$signature" = "$archive.sig" || {
            echo "missing updater signature for $(basename "$archive")" >&2
            exit 1
          }
          python3 scripts/desktop-updater-manifest.py \
            "$version" "$archive" "$signature" "$release_dir" \
            desktop/src-tauri/tauri.conf.json

      - name: Hand over macOS release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: dist/releases/
          if-no-files-found: error

  android:
    name: Build Android release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Verify tag version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          canonical_version="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)"
          release_version="$(cat scripts/release-version.txt)"
          test "$tag_version" = "$canonical_version" || {
            echo "tag version $tag_version does not match canonical version $canonical_version" >&2
            exit 1
          }
          test "$tag_version" = "$release_version" || {
            echo "tag version $tag_version does not match declared release version $release_version" >&2
            exit 1
          }

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "$name is required" >&2; exit 1; }
          done
          keystore="$RUNNER_TEMP/tariboy-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > desktop/src-tauri/gen/android/keystore.properties

      - name: Build and verify signed APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          make desktop-android

          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          apks=(desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)
          test "${#apks[@]}" -eq 1 || { echo "expected exactly one release APK" >&2; exit 1; }
          case "${apks[0]}" in *-unsigned.apk) echo "release APK is unsigned" >&2; exit 1 ;; esac
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "${apks[0]}"

          mkdir -p dist/android
          apk="Tariboy_${version}_android-arm64.apk"
          cp "${apks[0]}" "dist/android/$apk"
          (cd dist/android && sha256sum "$apk" > "$apk.sha256")

      - name: Hand over Android release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: dist/android/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [release, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Collect macOS release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release
          path: dist/releases/

      - name: Collect Android release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release
          path: dist/android/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_dir="dist/releases/$version"
          notes=$(cat <<NOTES
          **macOS note:** This build is not notarized by Apple.

          If macOS blocks the DMG: **System Settings → Privacy & Security → Open Anyway**

          **Android note:** Install the APK by hand (allow installs from unknown sources). The app has no local daemon: it connects to a port you forward to the phone or to an HTTPS server.
          NOTES
          )
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --notes "$notes" \
            --generate-notes \
            --title "Tariboy $version"
          gh release upload "$GITHUB_REF_NAME" "$release_dir"/* dist/android/*
          gh release edit "$GITHUB_REF_NAME" --draft=false

  docs:
    name: Publish documentation
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Publish documentation branch
        run: make docs
