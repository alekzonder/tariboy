schema_version: 2

plugins:
  - name: context
  - name: status
  - name: scripts
  - name: tasks
  - name: current-task
  - name: messages
  - name: loop

skills:
  - dir: ./.agents/skills/brainstorming
  - dir: ./.agents/skills/dispatching-parallel-agents
  - dir: ./.agents/skills/executing-plans
  - dir: ./.agents/skills/finishing-a-development-branch
  - dir: ./.agents/skills/receiving-code-review
  - dir: ./.agents/skills/requesting-code-review
  - dir: ./.agents/skills/subagent-driven-development
  - dir: ./.agents/skills/systematic-debugging
  - dir: ./.agents/skills/test-driven-development
  - dir: ./.agents/skills/using-git-worktrees
  - dir: ./.agents/skills/using-superpowers
  - dir: ./.agents/skills/verification-before-completion
  - dir: ./.agents/skills/writing-plans
  - dir: ./.agents/skills/writing-skills

prompts:
  - file: $CURRENT_VERSION_STORE/skills/whoami/prompt.md
  - runtime: identity
  - file: $CURRENT_VERSION_STORE/skills/context/prompt.md
  - runtime: context
  - file: $CURRENT_VERSION_STORE/skills/status/prompt.md
  - file: $CURRENT_VERSION_STORE/skills/scripts/prompt.md
  - file: $CURRENT_VERSION_STORE/skills/tasks/prompt.md
  - file: $CURRENT_VERSION_STORE/skills/current-task/prompt.md
  - file: $CURRENT_VERSION_STORE/skills/messages/prompt.md
  - runtime: messages
  - runtime: awaiting-replies
  - file: $CURRENT_VERSION_STORE/skills/loop/finish.md
  - file: ./instructions.md
  - runtime: user-prompt
  - runtime: one-shot
